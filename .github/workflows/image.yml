name: Build web image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check production container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$image:$GITHUB_SHA"
          migration_image="${image}-migrate:$GITHUB_SHA"
          docker build --platform linux/amd64 -t "$tag" .
          docker build --platform linux/amd64 --target migrate -t "$migration_image" .
          docker run -d --name oz-check -p 127.0.0.1:13000:3000 "$tag"
          trap 'docker logs oz-check; docker rm -f oz-check' EXIT
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 --connect-timeout 3 --max-time 5 http://127.0.0.1:13000/api/health
          curl --fail http://127.0.0.1:13000/ > /dev/null
          for path in /guide /guide/markdown /guide/environment /guide/alert-designs /guide/ideas '/api/guide?check=api' '/api/guide?check=database'; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:13000$path")" = 404
          done
          for path in /admin /admin/projects /admin/board /admin/settings; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:13000$path")" = 307
          done
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$tag"
          docker push "$migration_image"
          echo "Image: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Migration image: \`$migration_image\`" >> "$GITHUB_STEP_SUMMARY"
