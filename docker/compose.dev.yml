services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: oz_local
      POSTGRES_USER: oz_local
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - oz_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oz_local -d oz_local']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  oz_dev_db:
